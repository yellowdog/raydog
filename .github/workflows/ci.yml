name: CI

on:
  push:
    branches: [main, next-version]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The newest Ray the matrix tests against. The weekly workflow runs unpinned Ray
  # and says when this should move.
  RAY_LATEST: "2.60.0"
  RAY_FLOOR: "2.54.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy

  test:
    name: test (py${{ matrix.python }}, ray ${{ matrix.ray }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", ray: floor, os: ubuntu-latest }
          - { python: "3.13", ray: floor, os: ubuntu-latest }
          - { python: "3.10", ray: latest, os: ubuntu-latest }
          - { python: "3.12", ray: latest, os: ubuntu-latest }
          - { python: "3.14", ray: latest, os: ubuntu-latest }
          - { python: "3.12", ray: latest, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          RAY_VERSION=${{ matrix.ray == 'floor' && env.RAY_FLOOR || env.RAY_LATEST }}
          uv venv
          uv pip install -e ".[test]" "ray[default]==${RAY_VERSION}"
      - run: uv run --no-sync pytest --cov --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install build twine
      - run: uv run --no-sync python -m build
      - run: uv run --no-sync twine check --strict dist/*
      - name: Install the wheel into a clean environment and import it
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
          /tmp/wheel-env/bin/python -c "
          import yellowdog_ray, yellowdog_ray.testing, yellowdog_ray.core.yellowdog
          import yellowdog_ray.autoscaler, yellowdog_ray.builder
          import yellowdog_ray.tunnels, yellowdog_ray.cli
          print(yellowdog_ray.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[docs]"
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html

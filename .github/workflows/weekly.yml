name: Weekly (unpinned Ray)

# Runs the offline tests against whatever Ray is newest, so a new Ray release that
# breaks RayDog is noticed here first. A failure means: investigate, then move
# RAY_LATEST in ci.yml.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv && uv pip install --upgrade -e ".[test]"
      - run: uv pip list | grep -iE "^(ray|yellowdog-sdk) "
      - run: uv run --no-sync pytest

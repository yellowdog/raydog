# A Ray cluster on YellowDog, scaled by Ray's own autoscaler, with Ray running in
# containers on every node. The same as raydog.yaml except for the scripts.
#
# This file is a template: `./up.sh` fills in the ${RAYDOG_...} settings from the
# environment (see README.md) and runs `ray up` on the result. Everything else can
# be edited freely. Only two parts of a Ray cluster config belong to RayDog: the
# `provider` section, and each node type's `node_config`.

cluster_name: ${RAYDOG_CLUSTER_NAME}   # lowercase letters, digits, hyphens; max 24

provider:
  type: external
  module: yellowdog_ray.autoscaler.RayDogNodeProvider

  # The YellowDog namespace to create the cluster in. Required.
  namespace: ${RAYDOG_NAMESPACE}

  # The scripts that start Ray on the head node and on each worker node. Required.
  # Each runs as a YellowDog task for as long as the node lives. Give the text
  # itself, or "file:<path>" (relative paths are looked for beside the YAML file
  # given to `ray up`, then in the directory it is run from).
  head_start_script: "file:scripts/head-start-docker.sh"
  worker_start_script: "file:scripts/worker-start-docker.sh"

  # A tag for the YellowDog work requirement and compute requirements, to find the
  # cluster by in the portal (RAYDOG_TAG; none if it is not set). Optional.
  tag: "${RAYDOG_TAG}"

  # Optional settings, shown with their defaults:
  #
  # lifetime_hours: 24               # the cluster is stopped after this long,
  #                                  # whatever state it is in; "none" for no limit
  # build_timeout_minutes: 10        # how long the head node is given to start
  # node_idle_shutdown_seconds: 60   # how long an instance is kept after Ray has
  #                                  # finished with its node
  # worker_start_grace_seconds: 0    # how long a worker's start script may take
  #                                  # before Ray expects to hear from it; raise
  #                                  # this if workers pull a container image
  # use_internal_ips: false          # true if this machine reaches the head node
  #                                  # by its private address (no public IP)
  lifetime_hours: 2
  # A container takes a little longer to start than a bare Ray process
  worker_start_grace_seconds: 30

auth:
  ssh_user: yd-agent
  # The private key Ray uses for SSH to the head node. Its public half is put on
  # the nodes by the setup script below.
  ssh_private_key: ${RAYDOG_SSH_PRIVATE_KEY}

head_node_type: head
max_workers: 10
idle_timeout_minutes: 2

available_node_types:
  head:
    resources: {"CPU": 0}        # keep Ray tasks off the head node
    node_config:
      # The YellowDog compute requirement template for this kind of node. Required.
      compute_requirement_template: ${RAYDOG_HEAD_TEMPLATE}
      # The image, if the template does not fix one: a YellowDog image family as
      # namespace/name (best: it covers every region) or by ID, or an image ID such
      # as an AMI. Optional.
      images_id: ${RAYDOG_IMAGES_ID}
      # What to run when an instance boots: text, "file:<path>", or a list of
      # either, joined in order. Here: the settings, then the setup script, which
      # installs Docker, pulls the Ray image and installs the YellowDog Agent.
      userdata:
        - |
          #!/usr/bin/bash
          SSH_PUBLIC_KEY="${RAYDOG_SSH_PUBLIC_KEY}"
          RAYDOG_PIP_SPEC="${RAYDOG_PIP_SPEC}"
        - "file:scripts/node-setup-docker.sh"
      # Optional:
      # instance_tags: {team: research}
      # metrics_enabled: true

  worker:
    resources: {"CPU": 2}
    min_workers: 0
    max_workers: 4
    node_config:
      compute_requirement_template: ${RAYDOG_WORKER_TEMPLATE}
      images_id: ${RAYDOG_IMAGES_ID}
      userdata:
        - |
          #!/usr/bin/bash
          SSH_PUBLIC_KEY="${RAYDOG_SSH_PUBLIC_KEY}"
          RAYDOG_PIP_SPEC="${RAYDOG_PIP_SPEC}"
        - "file:scripts/node-setup-docker.sh"

# RayDog starts Ray itself, from the start scripts above, and sets nodes up through
# userdata, so Ray's own command lists must stay empty. Ray insists that these
# three are present all the same.
setup_commands: []
head_setup_commands: []
worker_setup_commands: []
